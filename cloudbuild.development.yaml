steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud artifacts repositories describe ${_ARTIFACT_REPOSITORY} --location=${_REGION} >/dev/null 2>&1 || \
        gcloud artifacts repositories create ${_ARTIFACT_REPOSITORY} \
          --repository-format=docker \
          --location=${_REGION} \
          --description="Docker images for edn-core"

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - deploy/docker/Dockerfile
      - -t
      - ${_IMAGE}
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy edn-core-dev \
          --image ${_IMAGE} \
          --region ${_REGION} \
          --platform managed \
          --allow-unauthenticated \
          --execution-environment gen2 \
          --port 8080 \
          --memory 512Mi \
          --cpu 1 \
          --concurrency 10 \
          --min-instances 0 \
          --max-instances 2 \
          --timeout 300 \
          --service-account ${_RUNTIME_SERVICE_ACCOUNT} \
          --env-vars-file .env.development \
          --set-secrets VIL_MONGODB_URI=${_MONGODB_URI_SECRET}:latest,VIL_LEADS_AUTH_TOKEN=${_LEADS_AUTH_TOKEN_SECRET}:latest,VIL_REDIS_PASSWORD=${_REDIS_PASSWORD_SECRET}:latest,VIL_PAYMENTS_WEBHOOK_SECRET_PATH=${_PAYMENTS_WEBHOOK_SECRET}:latest,VIL_PAYMENTS_INTERNAL_VERIFY_AUTH_TOKEN=${_PAYMENTS_INTERNAL_VERIFY_AUTH_TOKEN_SECRET}:latest,VIL_PAYMENTS_INFINITEPAY_API_TOKEN=${_PAYMENTS_INFINITEPAY_API_TOKEN_SECRET}:latest,VIL_PAYMENTS_WEBHOOK_URL=${_PAYMENTS_WEBHOOK_URL_SECRET}:latest

images:
  - ${_IMAGE}

substitutions:
  _REGION: southamerica-east1
  _ARTIFACT_REPOSITORY: edn-core
  _IMAGE: ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/edn-core-dev:${SHORT_SHA}
  _RUNTIME_SERVICE_ACCOUNT: edn-core-dev@$PROJECT_ID.iam.gserviceaccount.com
  _MONGODB_URI_SECRET: edn-core-dev-mongodb-uri
  _LEADS_AUTH_TOKEN_SECRET: edn-core-dev-leads-auth-token
  _REDIS_PASSWORD_SECRET: edn-core-dev-redis-password
  _PAYMENTS_WEBHOOK_SECRET: edn-core-dev-payments-webhook-secret-path
  _PAYMENTS_INTERNAL_VERIFY_AUTH_TOKEN_SECRET: edn-core-dev-payments-internal-verify-auth-token
  _PAYMENTS_INFINITEPAY_API_TOKEN_SECRET: edn-core-dev-payments-infinitepay-api-token
  _PAYMENTS_WEBHOOK_URL_SECRET: edn-core-dev-payments-webhook-url

options:
  logging: CLOUD_LOGGING_ONLY