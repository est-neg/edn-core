# Cloud Run env-vars for edn-meta-whatsapp-webhook-dev (public Meta webhook relay).
# Secrets (VIL_WHATSAPP_META_VERIFY_TOKEN, VIL_WHATSAPP_META_APP_SECRET,
# VIL_WHATSAPP_META_INTERNAL_VERIFY_AUTH_TOKEN) are injected via --set-secrets in cloudbuild and must NOT appear here.
# VIL_WHATSAPP_META_INTERNAL_INTAKE_URL and VIL_WHATSAPP_META_INTERNAL_AUDIENCE
# are derived from the deployed edn-meta-whatsapp-api-dev URL at deploy time,
# merged into a generated env-vars file, and passed via --env-vars-file.
VIL_HTTP_ADDR: ":8080"
VIL_HTTP_READ_TIMEOUT_SEC: "10"
VIL_HTTP_WRITE_TIMEOUT_SEC: "30"
VIL_HTTP_IDLE_TIMEOUT_SEC: "120"
VIL_LOG_LEVEL: "debug"
VIL_LOG_JSON: "true"
VIL_WHATSAPP_META_BODY_MAX_BYTES: "3145728"
